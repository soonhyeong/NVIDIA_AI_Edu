<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데이터 출력</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #fafafa; }
    a { display:inline-block; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>계산 결과</h1>
  <table>
    <tbody>
      <tr>
        <th>상품명</th>
        <td>{{ item.name }}</td>
      </tr>
      <tr>
        <th>상품설명</th>
        <td>{{ item.description }}</td>
      </tr>
      <tr>
        <th>가격</th>
        <td>{{ item.price }}</td>
      </tr>
      <tr>
        <th>세금</th>
        <td>{{ item.tax if item.tax is not none else '(미입력)' }}</td>
      </tr>
      <tr>
        <th>세금 포함 가격</th>
        <td>
          {% if item.price_with_tax is defined %}
            {{ item.price_with_tax }}
          {% else %}
            (세금 미입력)
          {% endif %}
        </td>
      </tr>
      <tr>
        <td>{{request}}</td>
      </tr>
    </tbody>
  </table>

  <!-- <a href="/items_tax/form">← 다시 입력</a> -->
  <a href="/">← 다시 입력</a>
</body>
</html>
